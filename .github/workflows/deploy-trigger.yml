# Deploys Trigger.dev workers on every push to main.
#
# Vercel's GitHub integration handles the Next.js web tier separately — no
# Action needed for that. This workflow only covers the worker side so the
# two tiers stay in lockstep.
#
# Required repo secret:
#   TRIGGER_ACCESS_TOKEN — Personal Access Token from
#     https://cloud.trigger.dev/account/tokens (NOT the project secret key).
#     The CLI uses this to authenticate the deploy.
name: Deploy Trigger.dev workers

on:
  push:
    branches: [main]
    # Only redeploy workers when files that affect them change.
    paths:
      - "worker/**"
      - "services/**"
      - "trigger.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-trigger.yml"
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Deploy to Trigger.dev (prod)
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: npx trigger.dev@latest deploy --env prod
